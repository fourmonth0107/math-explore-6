<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>六年級數學互動教室｜一、最大公因數與最小公倍數</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#203047;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#173451;color:white;padding:18px 24px}header h1{font-size:23px;margin:0 0 5px}header p{margin:0;color:#cbdbea}.layout{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 85px)}aside{background:white;border-right:1px solid #dfe5ee;padding:20px}aside h2{font-size:15px;color:#63768c}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 14px;background:#e9eff6;color:#203047}button:hover{filter:brightness(.97)}button.active,.primary{background:#1769ad;color:white}.nav{width:100%;text-align:left;margin:4px 0}.future{color:#728196}main{max-width:1100px;width:100%;margin:auto;padding:24px}.card{background:white;border:1px solid #e0e8f0;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 3px 14px #1734510a}h2{margin:0 0 10px;font-size:23px}h3{font-size:17px;margin:0 0 10px}.question{font-size:18px;line-height:1.85;white-space:pre-wrap}.sub{color:#62768b}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.visual{background:#f5f9fd;border:1px solid #e0e8f0;border-radius:12px;padding:12px;min-height:300px;display:flex;align-items:center;justify-content:center;overflow:auto}.visual svg{width:100%;max-width:760px;height:auto}.formula{font-size:23px;line-height:1.7;font-weight:650;color:#185a91;min-height:70px;white-space:pre-line}.narration{font-size:17px;line-height:1.75}.note{border-left:4px solid #e3a742;background:#fff8e8;padding:12px;border-radius:6px;line-height:1.7}.short{font-family:ui-monospace,Menlo,monospace;font-size:21px;white-space:pre;line-height:1.55;background:#eef4fa;padding:16px;border-radius:12px;display:inline-block;color:#203047}.tag{display:inline-block;border-radius:30px;padding:4px 10px;background:#dcebf7;color:#205f90;font-size:13px}.footer{font-size:13px;color:#6b7c90}select{font:inherit;border:1px solid #ccd8e5;border-radius:8px;padding:9px;background:white}@media(max-width:760px){.layout{display:block}aside{padding:10px;border-right:0;border-bottom:1px solid #ddd}aside h2{margin:5px}.nav{width:auto;margin:3px;font-size:13px}main{padding:12px}.card{padding:14px}.question{font-size:16px}.formula{font-size:19px}header h1{font-size:19px}}
</style></head><body><header><h1>六年級數學互動教室</h1><p>一、最大公因數與最小公倍數｜動畫 × 短除法 × 動態算式 × 語音說明</p></header><div class="layout"><aside><h2>單元導覽</h2><button class="nav active" id="unit1">一、最大公因數與最小公倍數</button><div id="nav"></div><h2>預留其他單元</h2><button class="nav future" id="future">＋ 新單元（尚未建立）</button></aside><main id="main"></main></div><script>
const lessons=[
{title:'剪正方形紙片',type:'gcd',a:84,b:70,answer:'最大邊長 14 公分，共剪成 30 個正方形。',question:'有一張長 84 公分、寬 70 公分的長方形卡紙，佳穎想全部剪成一樣大小的正方形，沒有剩下，且邊長是整數公分。正方形邊長最長是幾公分？共可剪成幾個正方形？',short:'2 │ 84   70\n7 │ 42   35\n  │  6    5',steps:[['觀察問題','要剪成一樣大的正方形，且沒有剩下，正方形邊長必須同時整除 84 和 70。','先找出 84 和 70 的最大公因數。'],['短除法','84 和 70 都可以除以 2，再同時除以 7，得到 6 和 5。','最大公因數＝2 × 7＝14（公分）'],['計算排列','長邊可以剪 84 除以 14 等於 6 個，寬邊可以剪 70 除以 14 等於 5 個。','84 ÷ 14＝6\n70 ÷ 14＝5'],['完成剪裁','六欄、五列的正方形，總共有三十個。','6 × 5＝30（個）']]},
{title:'雞蛋裝盒',type:'eggs',a:12,b:16,answer:'144 顆。',question:'一籃雞蛋的數量在 100 顆到 150 顆之間，每 12 顆裝一盒或每 16 顆裝一盒，都剛好裝完。這籃雞蛋有幾顆？',short:'2 │ 12   16\n2 │  6    8\n  │  3    4',steps:[['觀察問題','無論每盒裝十二顆或十六顆，都剛好裝完，因此雞蛋總數必須是十二和十六的公倍數。','找 12 和 16 的最小公倍數'],['短除法','兩數先共同除以二，再共同除以二，最後將外側和底下的數相乘。','最小公倍數＝2 × 2 × 3 × 4＝48'],['列出可能','四十八的倍數有四十八、九十六、一百四十四等。注意：一百二十不是四十八的倍數。','48 × 2＝96\n48 × 3＝144'],['符合範圍','在一百到一百五十顆之間，只有一百四十四顆是四十八的倍數。','144 ÷ 12＝12\n144 ÷ 16＝9\n答案：144 顆']]},
{title:'磁磚鋪正方形',type:'tiles',a:42,b:30,answer:'最少 35 塊磁磚。',question:'施工師傅想要用每塊長 42 公分、寬 30 公分的長方形磁磚，鋪滿一個正方形的地板，最少需要多少塊磁磚？（本題以長、寬整齊對齊的鋪法說明。）',short:'2 │ 42   30\n3 │ 21   15\n  │  7    5',steps:[['觀察問題','磁磚長四十二公分、寬三十公分。為了整齊鋪成正方形，邊長需同時是四十二和三十的倍數。','求 42 和 30 的最小公倍數'],['短除法','先共同除以二，再共同除以三，最後將二、三、七、五相乘。','最小公倍數＝2 × 3 × 7 × 5＝210（公分）'],['計算每排','正方形邊長二百一十公分，橫向放五塊，直向放七列。','210 ÷ 42＝5\n210 ÷ 30＝7'],['動畫鋪設','每按一次鋪設按鈕，就會增加一塊磁磚。五欄乘七列，共三十五塊。','5 × 7＝35（塊）']]},
{title:'導覽與 DIY 同時開始',type:'clock',a:30,b:45,answer:'上午 10 時 50 分。',question:'觀光工廠的導覽每 30 分鐘一場，DIY 每 45 分鐘一場，上午 9 時 20 分同時開始導覽和 DIY，下一次同時開始導覽和 DIY 是上午幾時幾分？',short:'3 │ 30   45\n5 │ 10   15\n  │  2    3',steps:[['觀察週期','導覽每三十分鐘開始一次，DIY 每四十五分鐘開始一次，要找下一次同時開始的時間。','求 30 和 45 的最小公倍數'],['短除法','先共同除以三，再共同除以五，底下剩二和三。','最小公倍數＝3 × 5 × 2 × 3＝90（分鐘）'],['換算時間','九十分鐘就是一小時三十分鐘。','90 分鐘＝1 小時 30 分鐘'],['推算時刻','上午九時二十分再過一小時三十分，就是上午十時五十分。','9:20 ＋ 1:30＝10:50']]},
{title:'餅乾平均分袋',type:'cookies',a:120,b:90,answer:'最多 30 袋；每袋原味 4 片、巧克力 3 片，共 7 片。',question:'阿姨烤了 120 片原味餅乾和 90 片巧克力餅乾，要平均裝成袋，每袋的原味餅乾數量相同、巧克力餅乾數量也相同，且剛好裝完，最多可以裝成幾袋？每袋有幾片餅乾？',short:'2 │ 120   90\n3 │  60   45\n5 │  20   15\n  │   4    3',steps:[['觀察問題','兩種餅乾都要平均分到相同數量的袋子，且全部分完，因此袋數必須同時整除一百二十和九十。','求 120 和 90 的最大公因數'],['短除法','兩數依序共同除以二、三、五，最後剩下四和三。','最大公因數＝2 × 3 × 5＝30（袋）'],['計算每袋','原味一百二十片分成三十袋，每袋四片；巧克力九十片分成三十袋，每袋三片。','120 ÷ 30＝4\n90 ÷ 30＝3'],['完成分裝','每袋有四片原味餅乾及三片巧克力餅乾，合計七片。','4 ＋ 3＝7（片）']]}
];
// 以陣列新增題目，未來可擴充為 units=[{title,lessons}]。
let current=0,step=0,progress=1,timer=null,spoken=false;const $=id=>document.getElementById(id);const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
function stop(){clearInterval(timer);timer=null;speechSynthesis.cancel();spoken=false}
function navigate(i){stop();current=i;step=0;progress=1;render()}
function renderNav(){$('nav').innerHTML=lessons.map((l,i)=>`<button class="nav ${i===current?'active':''}" data-i="${i}">${i+1}. ${l.title}</button>`).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>navigate(+b.dataset.i))}
function render(){renderNav();const l=lessons[current],s=l.steps[step];$('main').innerHTML=`<section class="card"><span class="tag">第 ${current+1} 題／共 5 題</span><h2 style="margin-top:10px">${l.title}</h2><div class="question">${esc(l.question)}</div></section><section class="card"><h3>情境互動動畫</h3><div class="visual" id="visual"></div><div class="controls"><button id="minus">◀ 上一步</button><button id="next" class="primary">下一步 ▶</button><button id="auto">▶ 自動播放</button><button id="pause">⏸ 暫停</button><button id="reset">↻ 重來</button><button id="speak">🔊 播放本步語音</button><button id="allvoice">🔊 逐步語音播放</button></div><div class="controls"><label>動畫速度 <select id="speed"><option value="1300">慢速</option><option value="800" selected>正常</option><option value="350">快速</option></select></label>${l.type==='tiles'?'<button id="one">＋ 鋪一塊磁磚</button><button id="row">＋ 鋪一列</button>':''}</div></section><section class="card"><span class="tag">步驟 ${step+1} / ${l.steps.length}</span><h3 style="margin-top:10px">${s[0]}</h3><div class="narration">${s[1]}</div><h3 style="margin-top:18px">動態算式</h3><div class="formula" id="formula"></div><details ${step===1?'open':''}><summary style="cursor:pointer;font-weight:600">查看短除法</summary><div class="short">${esc(l.short)}</div></details></section><section class="card"><h3>解答</h3><p class="narration">${l.answer}</p>${current===1?'<div class="note">教學提醒：100～150 之間，48 的倍數只有 144。120 不是 16 的倍數，所以不符合條件。</div>':''}${current===2?'<div class="note">教學說明：以磁磚方向一致、橫直對齊的鋪法求解。磁磚內不放文字，尺寸只標在第一塊外側。</div>':''}${current===4?'<div class="note">每袋共 7 片餅乾，但應清楚區分：原味 4 片、巧克力 3 片。</div>':''}</section><p class="footer">語音使用裝置內建 Web Speech 語音合成。iPad / Mac 的 Safari 可點擊按鈕播放；首次播放需使用者操作。</p>`;
$('minus').onclick=()=>change(-1);$('next').onclick=()=>change(1);$('auto').onclick=auto;$('pause').onclick=stop;$('reset').onclick=()=>navigate(current);$('speak').onclick=()=>speak();$('allvoice').onclick=voiceAll;$('future').onclick=()=>alert('已預留單元擴充架構，可在資料陣列中加入新單元與題目。');if($('one')){$('one').onclick=()=>{progress=Math.min(35,progress+1);draw()};$('row').onclick=()=>{progress=Math.min(35,progress+5);draw()}}draw();animateFormula()}
function change(d){stop();step=Math.max(0,Math.min(3,step+d));if(current===2&&step===3)progress=Math.max(1,progress);render()}
function animateFormula(){let txt=lessons[current].steps[step][2],el=$('formula'),i=0;el.textContent='';let t=setInterval(()=>{if(!el.isConnected){clearInterval(t);return}el.textContent=txt.slice(0,++i);if(i>=txt.length)clearInterval(t)},28)}
function speak(callback){speechSynthesis.cancel();let l=lessons[current],s=l.steps[step],u=new SpeechSynthesisUtterance(`${l.title}。第${step+1}步，${s[0]}。${s[1]}。算式：${s[2].replaceAll('÷','除以').replaceAll('×','乘以').replaceAll('＝','等於')}`);u.lang='zh-TW';u.rate=.87;const v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('zh-tw'));if(v)u.voice=v;if(callback)u.onend=callback;speechSynthesis.speak(u)}
function voiceAll(){stop();function run(){speak(()=>{if(step<3){step++;render();setTimeout(run,500)}})}run()}
function auto(){stop();const ms=Number($('speed').value);timer=setInterval(()=>{if(current===2&&step===3&&progress<35){progress++;draw();return}if(step<3){step++;render();auto()}else stop()},ms)}
const T=(x,y,t,size=16,color='#27465e',anchor='middle')=>`<text x="${x}" y="${y}" font-size="${size}" fill="${color}" text-anchor="${anchor}" font-family="sans-serif">${t}</text>`;
function svg(inner){$('visual').innerHTML=`<svg viewBox="0 0 760 320" role="img" aria-label="數學情境動畫示意圖">${inner}</svg>`}
function draw(){let l=lessons[current];if(l.type==='gcd'){
// 84:70 = 6:5. Each 14 cm square must have identical pixel width and height.
const size=42, x0=214, y0=51, cols=6, rows=5;
let z=`<rect x="${x0}" y="${y0}" width="${cols*size}" height="${rows*size}" fill="#f5e5b9" stroke="#8b6b3e" stroke-width="2.5"/>`;
if(step>=2){
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const idx=y*cols+x;
    const show=step>=2;
    if(show)z+=`<rect x="${x0+x*size}" y="${y0+y*size}" width="${size}" height="${size}" fill="${(x+y)%2?'#c7e4fa':'#a5d3f2'}" stroke="#4e87ad" stroke-width="1.2"/>`;
  }
  // Full cut lines are visible in the final step, showing no waste.
  if(step===3){for(let x=1;x<cols;x++)z+=`<line x1="${x0+x*size}" y1="${y0}" x2="${x0+x*size}" y2="${y0+rows*size}" stroke="#4e87ad"/>`;
    for(let y=1;y<rows;y++)z+=`<line x1="${x0}" y1="${y0+y*size}" x2="${x0+cols*size}" y2="${y0+y*size}" stroke="#4e87ad"/>`;
  }
}
z+=`<path d="M${x0} 41 V35 M${x0+cols*size} 41 V35 M${x0} 38 H${x0+cols*size}" fill="none" stroke="#617b94" stroke-width="1.5"/>`;
z+=T(x0+cols*size/2,27,'長 84 公分',18);
z+=T(123,153,'寬 70 公分',18);
if(step>=2){
 z+=`<path d="M${x0} ${y0+rows*size+9} V${y0+rows*size+17} M${x0+size} ${y0+rows*size+9} V${y0+rows*size+17} M${x0} ${y0+rows*size+13} H${x0+size}" fill="none" stroke="#b47b2b" stroke-width="1.5"/>`;
 z+=T(x0+size/2,y0+rows*size+33,'14 公分',13,'#9b661c');
 z+=T(602,112,'每格 14 × 14 公分',17);
 z+=T(602,153,'長邊 6 格、寬邊 5 格',17);
 z+=T(602,195,step===3?'30 個正方形，沒有剩下':'剪裁成相同大小的正方形',16);
}else z+=T(602,150,step===1?'最大公因數 = 14':'完整長方形卡紙',19);
svg(z);
}
else if(l.type==='eggs'){let z='';let n=step>=3?144:step===2?96:48;for(let i=0;i<n;i++){let x=30+(i%24)*23,y=20+Math.floor(i/24)*38;z+=`<ellipse cx="${x}" cy="${y+8}" rx="7" ry="10" fill="#f2d6a4" stroke="#b8905e"/>`}svg(z+T(375,300,`展示 ${n} 顆雞蛋（每 12 或 16 顆分組）`,18))}
else if(l.type==='tiles'){let z=`<rect x="140" y="40" width="420" height="240" fill="#e9eef4" stroke="#53718d" stroke-width="2"/>`;let n=step===3?progress:step===2?35:1;for(let i=0;i<n;i++){let x=140+(i%5)*84,y=40+Math.floor(i/5)*(240/7);z+=`<rect x="${x}" y="${y}" width="84" height="${240/7}" fill="${i===0?'#f6d28b':i%2?'#d1eafc':'#acd7f4'}" stroke="#6089ac"/>`}z+=`<path d="M140 35 V28 M224 35 V28 M140 31 H224 M228 40 H236 M228 74.28 H236 M233 40 V74.28" stroke="#b77d22" fill="none" stroke-width="2"/>`+T(182,21,'長 42 cm',14,'#a36b13')+T(275,60,'寬 30 cm',14,'#a36b13')+T(350,306,`正方形邊長 210 公分｜${n} / 35 塊`,17);svg(z)}
else if(l.type==='clock'){let z='';for(let row=0;row<2;row++){let interval=row===0?30:45;z+=T(90,95+row*90,row===0?'導覽':'DIY',20);for(let m=0;m<=90;m+=interval){let x=170+m*5;z+=`<circle cx="${x}" cy="${85+row*90}" r="${m===90?12:8}" fill="${m===90?'#e4a347':'#4e9acb'}"/>`+T(x,116+row*90,`${m}分`,12)}}z+=`<line x1="620" y1="50" x2="620" y2="220" stroke="#e4a347" stroke-width="3" stroke-dasharray="6 5"/>`+T(380,275,step>=3?'上午 9:20 ＋ 90 分鐘＝上午 10:50':'兩種活動的共同開始時間',20);svg(z)}
else{let z='';for(let i=0;i<Math.min(step>=2?30:10,30);i++){let x=38+(i%10)*69,y=25+Math.floor(i/10)*83;z+=`<rect x="${x}" y="${y}" width="60" height="70" rx="8" fill="#e7f1fc" stroke="#7295b4"/>`;for(let k=0;k<4;k++)z+=`<circle cx="${x+11+(k%2)*15}" cy="${y+16+Math.floor(k/2)*16}" r="6" fill="#d9ad70"/>`;for(let k=0;k<3;k++)z+=`<circle cx="${x+44}" cy="${y+15+k*16}" r="5" fill="#81523b"/>`}svg(z+T(380,306,step>=2?'30 袋：每袋原味 4 片＋巧克力 3 片':'原味 120 片、巧克力 90 片',18))}}
render();
</script></body></html>
